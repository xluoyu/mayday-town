<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卜卜的圣诞小镇 · 场景总览</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", sans-serif; color: #f4e8cf; background: #142c39; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1500px; margin: auto; padding: 30px 28px 40px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    h1 { font-size: 24px; font-weight: 500; margin: 0; }
    a { color: #c9d7d4; font-size: 14px; text-underline-offset: 5px; }
    nav { display: flex; gap: 10px; margin: 24px 0 18px; flex-wrap: wrap; }
    button { font: inherit; font-size: 14px; padding: 11px 22px; border-radius: 24px; border: 1px solid #4f6b70; background: #1a3743; color: #c9d7d4; cursor: pointer; }
    button[aria-pressed="true"] { background: #e8cf9d; color: #213e46; border-color: #e8cf9d; }
    button:focus-visible, a:focus-visible { outline: 3px solid #f3b775; outline-offset: 4px; }
    figure { margin: 0; overflow: hidden; border-radius: 18px; background: #123140; }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 45px; margin-top: 22px; }
    h2 { font-size: 22px; font-weight: 500; margin: 0 0 10px; }
    p { color: #bdcecc; font-size: 14px; line-height: 1.9; margin: 0; }
    ul { margin: 0; padding-left: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 25px; color: #dfd9c6; font-size: 14px; line-height: 1.6; }
    footer { border-top: 1px solid #35525c; margin-top: 24px; padding-top: 16px; font-size: 12px; line-height: 1.8; color: #94aead; }
    @media (max-width: 720px) { main { padding: 20px 14px; } h1 { font-size: 19px; } button { padding: 10px 16px; } .details { grid-template-columns: 1fr; gap: 20px; } }
  </style>
</head>
<body>
<main>
  <header><h1>卜卜的圣诞小镇 · 场景总览</h1><a href="/">返回小镇</a></header>
  <nav aria-label="选择场景"></nav>
  <figure><img id="scene-image" alt=""></figure>
  <section class="details" aria-live="polite">
    <div><h2 id="scene-title"></h2><p id="scene-description"></p></div>
    <ul id="scene-points" aria-label="候选交互点位"></ul>
  </section>
  <footer>场景概念图。图中角色用于比例与位置示意，正式场景使用独立的 3/4 多角度角色贴图。各区域按固定道路连接点位，玩法可后续逐项填充。</footer>
</main>
<script type="module">
const scenes = [
  {
    title: '中央小镇', image: new URL('./town-art-direction-v1.png', import.meta.url).href,
    description: '中央圣诞树作为全镇的视觉锚点。四个主题建筑围绕广场分布，后续从这里前往集市、冰湖和车站。',
    points: ['姜饼工坊', '礼物小屋', '雪橇驿站', '铃铛音乐亭']
  },
  {
    title: '圣诞集市', image: new URL('./scene-market-v1.png', import.meta.url).href,
    description: '灯串下的开放广场连接五个主题点位。环路和门前空地适合摊位互动、装饰和季节性内容。',
    points: ['热可可摊', '圣诞邮局', '礼物包装台', '雪人庭院', '木偶小舞台']
  },
  {
    title: '冰湖乐园', image: new URL('./scene-lake-v1.png', import.meta.url).href,
    description: '环湖步道区分移动路线和活动空间。冰场、坡道、檐下冰洞与合影平台各自保留独立入口。',
    points: ['冰场入口与租赁屋', '雪橇坡', '冰钓小屋', '合影平台']
  },
  {
    title: '星光车站', image: new URL('./scene-station-v1.png', import.meta.url).href,
    description: '铁路与步道通过围栏分开。站房、货运棚、观星台和营地围绕中部通道，形成安静的林间探索区域。',
    points: ['站房窗口', '货运棚', '观星台', '林间营地']
  }
];
const nav = document.querySelector('nav');
function selectScene(index) {
  const scene = scenes[index];
  document.querySelector('#scene-image').src = scene.image;
  document.querySelector('#scene-image').alt = scene.title + '场景概念图';
  document.querySelector('#scene-title').textContent = scene.title;
  document.querySelector('#scene-description').textContent = scene.description;
  document.querySelector('#scene-points').replaceChildren(...scene.points.map(point => {
    const item = document.createElement('li');
    item.textContent = point;
    return item;
  }));
  [...nav.children].forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
}
scenes.forEach((scene, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = scene.title;
  button.onclick = () => selectScene(index);
  nav.append(button);
});
selectScene(0);
</script>
</body>
</html>
